    <script>
      // Guard against extension scripts attempting to overwrite window.fetch in environments where it only has a getter
      (function() {
        try {
          var _rawFetch = window.fetch;
          var _customFetch = _rawFetch;

          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _customFetch || _rawFetch;
            },
            set: function(val) {
              _customFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto) {
              var pFetch = proto.fetch || window.fetch;
              Object.defineProperty(proto, 'fetch', {
                get: function() {
                  return proto.__fetchOverride || pFetch;
                },
                set: function(val) {
                  proto.__fetchOverride = val;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (err) {}
        }

        // Suppress unhandled errors originating from injected chrome-extension scripts
        window.addEventListener('error', function(event) {
          if (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
            return true;
          }
        });
      })();
    </script>
