<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2c2c2c"/>
      <stop offset="100%" stop-color="#1d1d1d"/>
    </radialGradient>
    <filter id="letterShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background with subtle bevel/texture feel -->
  <rect width="512" height="512" rx="32" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="30" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  
  <!-- Classic Editorial Serif 'A' matching Playfair / Alter mark -->
  <g filter="url(#letterShadow)">
    <text x="50%" y="375" text-anchor="middle" font-family="'Playfair Display', 'Didot', 'Bodoni MT', 'Times New Roman', serif" font-weight="700" font-size="340" fill="#f4f1ea" letter-spacing="-2">A</text>
  </g>
</svg>
